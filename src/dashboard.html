<!doctype html>
<html lang="ja" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyFeed</title>
  <link rel="stylesheet" href="style-base.css" />
  <link rel="stylesheet" href="style-features.css" />
  <link rel="stylesheet" href="style-v011.css" />
  <link rel="stylesheet" href="style-v015.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">MF</div>
        <div>
          <h1>MyFeed</h1>
          <p>Prototype</p>
        </div>
      </div>

      <nav class="nav-list" id="navList">
        <button class="nav-item active" data-filter="all"><span>📰</span><span>すべて</span><b id="countAll">0</b></button>
        <button class="nav-item" data-filter="unread"><span>●</span><span>未読</span><b id="countUnread">0</b></button>
        <button class="nav-item" data-filter="favorite"><span>⭐</span><span>お気に入り</span><b id="countFavorite">0</b></button>
        <div class="nav-divider"></div>
        <div id="sourceNav" class="source-nav"></div>
      </nav>

      <div class="sidebar-footer">
        <button id="openSourcesBtn" class="secondary-btn full">＋ フィードを登録</button>
        <button id="openCategoriesBtn" class="ghost-btn full">＋ カテゴリを管理</button>
        <button id="openSettingsBtn" class="ghost-btn full">⚙ 設定</button>
      </div>
    </aside>

    <main class="main">
      <div class="sticky-main-header">
      <header class="topbar">
        <div>
          <h2 id="viewTitle">すべての記事</h2>
          <p id="statusText">フィードを登録して「更新」を押してください。</p>
        </div>
        <div class="topbar-actions">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input id="searchInput" type="search" placeholder="記事を検索" autocomplete="off" />
          </label>
          <button id="refreshBtn" class="primary-btn">↻ 更新</button>
        </div>
      </header>

      <section class="toolbar">
        <div class="toolbar-left">
          <select id="sortSelect" aria-label="表示・並び順">
            <option value="newest">新しい順</option>
            <option value="oldest">古い順</option>
            <option value="unreadOnly">未読のみ</option>
            <option value="readOnly">既読のみ</option>
            <option value="all">すべて</option>
          </select>
          <button id="markAllReadBtn" class="ghost-btn">表示中を既読</button>
          <div class="view-toggle" role="group" aria-label="記事の表示方法">
            <button id="viewCardBtn" class="view-toggle-btn active" type="button" aria-pressed="true">▦ カード</button>
            <button id="viewCompactBtn" class="view-toggle-btn" type="button" aria-pressed="false">☷ コンパクト</button>
          </div>
        </div>
        <div class="toolbar-right">
          <span id="articleCount">0件</span>
        </div>
      </section>
      </div>

      <section id="emptyState" class="empty-state">
        <div class="empty-icon">🛰️</div>
        <h3>まだ記事がありません</h3>
        <p>RSS、Google Newsのキーワード、Xアカウントを登録できます。</p>
        <button id="emptyAddBtn" class="primary-btn">最初のフィードを登録</button>
      </section>

      <section id="feedList" class="feed-list" hidden></section>
      <div id="loadMoreWrap" class="load-more-wrap" hidden>
        <button id="loadMoreBtn" class="secondary-btn">さらに50件表示</button>
      </div>
    </main>
  </div>

  <dialog id="sourcesDialog" class="modal">
    <form method="dialog" class="modal-card" id="sourceForm">
      <div class="modal-header">
        <div>
          <h3>フィードを登録</h3>
          <p>3種類を同じ一覧へまとめます。</p>
        </div>
        <button id="closeSourcesBtn" type="button" class="icon-btn" aria-label="閉じる">×</button>
      </div>

      <div class="form-grid">
        <label>
          <span>種類</span>
          <select id="sourceType">
            <option value="rss">Webサイト RSS</option>
            <option value="google">Google News キーワード</option>
            <option value="x">Xアカウント（Nitter RSS）</option>
          </select>
        </label>

        <label>
          <span>表示名</span>
          <input id="sourceName" required placeholder="例：ITmedia AI+" />
        </label>

        <label>
          <span>カテゴリ</span>
          <select id="sourceCategory">
            <option value="">未分類</option>
          </select>
        </label>

        <label class="wide">
          <span id="sourceValueLabel">RSS URL</span>
          <input id="sourceValue" required placeholder="https://example.com/feed.xml" />
          <small id="sourceHint">RSS / Atom URLを入力してください。</small>
        </label>
      </div>

      <div class="modal-actions">
        <button id="cancelSourcesBtn" type="button" class="ghost-btn">キャンセル</button>
        <button id="saveSourceBtn" type="submit" value="default" class="primary-btn">登録する</button>
      </div>
    </form>

    <div class="source-manager">
      <div class="source-manager-head">
        <strong>登録済み</strong>
        <span id="sourceCount">0件</span>
      </div>
      <div id="sourceList" class="source-list"></div>
    </div>
  </dialog>

  <dialog id="settingsDialog" class="modal small">
    <form method="dialog" class="modal-card" id="settingsForm">
      <div class="modal-header">
        <div>
          <h3>設定</h3>
          <p>更新間隔などを設定します。</p>
        </div>
        <button id="closeSettingsBtn" type="button" class="icon-btn" aria-label="閉じる">×</button>
      </div>

      <label class="stack-label">
        <span>画面を開いている間の自動更新</span>
        <select id="autoRefreshMinutes">
          <option value="0">OFF</option>
          <option value="15">15分</option>
          <option value="30" selected>30分</option>
          <option value="60">60分</option>
        </select>
      </label>

      <label class="stack-label">
        <span>テーマ</span>
        <select id="themeMode">
          <option value="system" selected>ブラウザに合わせる</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
        <small>「ブラウザに合わせる」はEdge / Windowsのライト・ダーク設定に自動追従します。</small>
      </label>

      <section class="category-settings">
        <div class="setting-section-head">
          <div>
            <strong>左カラムのカテゴリ</strong>
            <small>フィードは左カラムでドラッグしてカテゴリ間を移動できます。</small>
          </div>
        </div>
        <div class="category-add-row">
          <input id="categoryNameInput" type="text" placeholder="例：AI・テック" maxlength="40" />
          <button id="addCategoryBtn" type="button" class="secondary-btn">追加</button>
        </div>
        <div id="categoryManagerList" class="category-manager-list"></div>
      </section>

      <div class="danger-zone">
        <div>
          <strong>記事キャッシュ</strong>
          <small>72時間を超えた記事は自動削除します。⭐お気に入り記事は残ります。</small>
        </div>
        <button id="clearArticlesBtn" type="button" class="danger-btn">記事を全削除</button>
      </div>

      <div class="modal-actions">
        <button id="cancelSettingsBtn" type="button" class="ghost-btn">キャンセル</button>
        <button id="saveSettingsBtn" type="submit" value="default" class="primary-btn">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="dashboard-1.js"></script>
  <script src="dashboard-2.js"></script>
  <script src="dashboard-3.js"></script>
  <script src="dashboard-5.js"></script>
  <script src="dashboard-6.js"></script>
  <script src="dashboard-7.js"></script>
  <script src="dashboard-8.js"></script>
  <script src="dashboard-9.js"></script>
  <script src="dashboard-10.js"></script>
  <script src="dashboard-4.js"></script>
</body>
</html>
