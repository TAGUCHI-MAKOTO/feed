name: Build compact MyFeed

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build compact package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          src = Path('src')
          out = Path('compact')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(exist_ok=True)

          js_order = [
              'core-storage.js',
              'feed-parser.js',
              'dedupe.js',
              'dedupe-latest.js',
              'dashboard-health.js',
              'source-icons.js',
              'source-nav-render.js',
              'article-render.js',
              'image-enrichment.js',
              'google-news-thumbnail-fix.js',
              'dedupe-content.js',
              'category-backup.js',
              'app-events.js',
              'source-input.js',
              'source-discovery.js',
              'health-reconcile.js',
              'youtube-category-ui.js',
              'youtube-validation.js',
              'unread-copilot.js',
              'reading-flow.js',
          ]

          css_order = [
              'style-base.css',
              'style-theme.css',
              'style-ui.css',
              'style-latest.css',
          ]

          def bundle(files, comment_prefix, comment_suffix=''):
              chunks = []
              for name in files:
                  text = (src / name).read_text(encoding='utf-8')
                  chunks.append(f'{comment_prefix} {name} {comment_suffix}\n{text.rstrip()}\n')
              return '\n'.join(chunks)

          (out / 'dashboard.js').write_text(
              bundle(js_order, '/* =====', '===== */'),
              encoding='utf-8'
          )
          (out / 'style.css').write_text(
              bundle(css_order, '/* =====', '===== */'),
              encoding='utf-8'
          )

          html = (src / 'dashboard.html').read_text(encoding='utf-8')
          old_css = ''.join(f'  <link rel="stylesheet" href="{name}" />\n' for name in css_order)
          html = html.replace(old_css, '  <link rel="stylesheet" href="style.css" />\n')
          old_js = ''.join(f'  <script src="{name}"></script>\n' for name in js_order)
          html = html.replace(old_js, '  <script src="dashboard.js"></script>\n')
          (out / 'dashboard.html').write_text(html, encoding='utf-8')

          shutil.copy2(src / 'manifest.json', out / 'manifest.json')
          shutil.copy2(src / 'service-worker.js', out / 'service-worker.js')

          (out / 'README.txt').write_text(
              'MyFeed compact build\n'
              '====================\n\n'
              'Edge: edge://extensions/ → 開発者モード → 「展開して読み込み」→ このフォルダを指定してください。\n\n'
              'この配布版では、開発用に分割されている JavaScript を dashboard.js、CSS を style.css にまとめています。\n'
              '機能は src の分割版と同じです。\n\n'
              '拡張機能用のPNGアイコンは同梱していません。画面左上のMyFeedブランド表示（MF）はそのまま残しています。\n',
              encoding='utf-8'
          )

          expected = {
              'dashboard.html', 'dashboard.js', 'style.css',
              'manifest.json', 'service-worker.js', 'README.txt'
          }
          actual = {p.name for p in out.iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f'Unexpected compact files: {sorted(actual)}')

          dashboard_js = (out / 'dashboard.js').read_text(encoding='utf-8')
          required_modules = ['source-input.js', 'google-news-thumbnail-fix.js', 'dedupe-latest.js']
          if not all(name in dashboard_js for name in required_modules):
              raise SystemExit('dashboard.js bundle validation failed')
          if 'style-latest.css' not in (out / 'style.css').read_text(encoding='utf-8'):
              raise SystemExit('style.css bundle validation failed')
          if '<script src="dashboard.js"></script>' not in html:
              raise SystemExit('dashboard.html JS replacement failed')
          if '<link rel="stylesheet" href="style.css" />' not in html:
              raise SystemExit('dashboard.html CSS replacement failed')
          PY

      - name: Upload compact package
        uses: actions/upload-artifact@v4
        with:
          name: MyFeed-compact
          path: compact/
          if-no-files-found: error
          retention-days: 30
